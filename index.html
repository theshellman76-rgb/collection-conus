<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Conus</title>
<meta name="description" content="Collection privée de coquillages Conus.">
<link rel="stylesheet" href="style.css">
<script src="auth.js"></script>
<script>
  // Si déjà déverrouillé, on passe directement à la collection.
  if (typeof isUnlocked === "function" && isUnlocked()) {
    location.replace("collection.html");
  }
</script>
</head>
<body>

<div class="gate-wrap">
  <div class="gate-left">
    <p class="eyebrow">Catalogue privé · Conidae</p>
    <h1 class="site-title">Collection<br><em>Conus</em></h1>
    <p class="site-sub">Espace privé. Entre le mot de passe pour accéder à la collection complète.</p>

    <form id="gate-form" class="gate-form" autocomplete="off">
      <label for="gate-passcode" class="gate-label">Mot de passe</label>
      <input type="password" id="gate-passcode" class="gate-input" placeholder="••••••••" autofocus>
      <label class="gate-remember">
        <input type="checkbox" id="gate-remember">
        Se souvenir de moi sur cet appareil
      </label>
      <button type="submit" class="gate-submit">Entrer</button>
      <p class="gate-error hidden" id="gate-error">Mot de passe incorrect.</p>
    </form>

    <p class="gate-share-note">Tu as un lien de partage ? Utilise-le directement — il ne nécessite pas de mot de passe.</p>
  </div>

  <div class="gate-right">
    <p class="gate-preview-label">Quelques favoris de la collection</p>
    <div id="gate-preview-grid" class="gate-preview-grid">
      <div class="muted-note" id="gate-preview-loading">Chargement…</div>
    </div>
  </div>
</div>

<script src="home.js"></script>
</body>
</html>
